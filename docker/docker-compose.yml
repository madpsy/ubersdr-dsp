services:

  # ── ubersdr-dsp gRPC server ─────────────────────────────────────────────────
  ubersdr-dsp:
    image: madpsy/ubersdr-dsp:latest
    container_name: ubersdr-dsp
    ports:
      - "50051:50051"      # gRPC endpoint
    command: ["--grpc-port", "50051"]
    restart: unless-stopped
    networks:
      - dsp-net
    environment:
      # BNR worker thread mode (only relevant when using filter: "bnr"):
      #   unset or "batch"       = default: 200ms batch + WritesDone (recommended)
      #   "concurrent"           = debug:   persistent stream, two threads, no WritesDone
      #   "legacy"               = debug:   persistent stream, alternating Write→Read
      # BNR_WORKER_MODE: "batch"
    healthcheck:
      # grpc_health_probe checks the gRPC health service registered by the server
      test: ["CMD-SHELL", "grpc_health_probe -addr=localhost:50051 2>/dev/null || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── NVIDIA Maxine BNR NIM ────────────────────────────────────────────────────
  # Prerequisites:
  #   1. docker login nvcr.io  (username: $oauthtoken, password: NGC API key)
  #   2. docker pull nvcr.io/nim/nvidia/maxine-bnr:1.0.0
  #   3. NVIDIA Container Toolkit installed on the host
  #
  # Usage:
  #   docker compose --profile gpu up
  #
  # ubersdr-dsp will reach BNR at "maxine-bnr:8001" on the shared dsp-net network.
  # Send a SessionConfig with:
  #   filter_id: "bnr"
  #   params { key: "bnr-address"  value: "maxine-bnr:8001" }
  #   params { key: "intensity"    value: "0.8" }
  maxine-bnr:
    image: nvcr.io/nim/nvidia/maxine-bnr:1.0.0
    container_name: maxine-bnr
    profiles: [gpu]
    ports:
      - "8001:8001"        # expose on host too (optional, for direct testing)
    networks:
      - dsp-net
    environment:
      # Set NGC_API_KEY to your NGC API key (required to download the model on first run).
      # NGC_API_KEY: your_ngc_api_key_here
      #
      # Note: BNR_WORKER_MODE is set on the ubersdr-dsp service above, not here.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

networks:
  dsp-net:
    driver: bridge
